  shared_preferences: ^2.5.6
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  permission_handler: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
