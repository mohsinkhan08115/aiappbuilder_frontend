name: aiappbuilder
description: "AI Flutter App Builder - Frontend"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  dio: ^5.4.1
  path_provider: ^2.1.2
  url_launcher: ^6.2.6
  file_picker: ^8.0.3
